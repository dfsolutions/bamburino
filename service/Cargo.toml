[workspace]
resolver = "3"
members = ["crates/bamburino-core", "crates/bamburino"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dfsolutions/bamburino"

# Exact pins (`=`): never a range, never `*`.
[workspace.dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "=0.8.9"
rmcp = { version = "=3.5.1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "=1.2.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
thiserror = "=2.0.21"
async-trait = "=0.1.92"
clap = { version = "=4.6.7", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
tracing-appender = "=0.2.5"
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }
strsim = "=0.11.1"
subtle = "=2.6.1"
getrandom = "=0.4.3"
hex = "=0.4.3"
sha2 = "=0.11.1"
wiremock = "=0.6.5"
tempfile = "=3.27.0"
assert_cmd = "=2.2.2"
