# Test fixture for ci/check-workflows.ps1 - 'contents : write' with a space before the colon (rules d, g)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with: { sparse-checkout: ci/maintainers.txt }
      - run: grep -qxF "${{ github.actor }}" ci/maintainers.txt || { echo "::error::actor not allowed on self-hosted runner"; exit 1; }
  build:
    needs: guard
    runs-on: [self-hosted, windows]
    permissions:
      contents : write
    steps:
      - run: echo
