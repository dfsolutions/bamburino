# Test fixture for ci/check-workflows.ps1 - self-hosted job without needs: guard (rule c)
name: bad-no-guard
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v7.0.1
        with: { sparse-checkout: ci/maintainers.txt }
      - run: grep -qxF "${{ github.actor }}" ci/maintainers.txt || { echo "::error::actor not allowed on self-hosted runner"; exit 1; }
  build:
    runs-on: [self-hosted, windows]
    steps:
      - run: echo build
