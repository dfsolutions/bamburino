# Test fixture for ci/check-workflows.ps1 - case-variant runner name is not hosted (rule c)
name: good-self-hosted
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: Ubuntu-Latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v7.0.1
        with: { sparse-checkout: ci/maintainers.txt }
      - run: grep -qxF "${{ github.actor }}" ci/maintainers.txt || { echo "::error::actor not allowed on self-hosted runner"; exit 1; }
  build:
    needs: [guard]
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v7.0.1
      - run: echo build
